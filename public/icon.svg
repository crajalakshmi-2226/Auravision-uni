<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="60%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="earthGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="512" height="512" rx="100" fill="url(#spaceBg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#nebulaGlow)"/>

  <!-- Background Stars -->
  <circle cx="120" cy="110" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="390" cy="90" r="2" fill="#00f0ff" opacity="0.8"/>
  <circle cx="430" cy="380" r="3" fill="#c084fc" opacity="0.85"/>
  <circle cx="90" cy="400" r="1.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="200" cy="70" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="340" cy="440" r="2.2" fill="#00f0ff" opacity="0.8"/>

  <!-- Orbital Outer Rings -->
  <ellipse cx="256" cy="256" rx="200" ry="85" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.75" transform="rotate(-28 256 256)" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="12 8" opacity="0.6" transform="rotate(35 256 256)"/>

  <!-- Celestial Earth Sphere -->
  <circle cx="256" cy="256" r="105" fill="url(#earthGrad)" filter="url(#glow)"/>

  <!-- Continent approximations with neon glow -->
  <path d="M 210,195 Q 230,180 250,190 Q 275,200 290,185 Q 295,210 280,225 Q 260,240 235,230 Q 215,225 210,195 Z" fill="#10b981" opacity="0.75"/>
  <path d="M 240,250 Q 260,245 285,260 Q 275,290 260,310 Q 240,300 240,270 Z" fill="#059669" opacity="0.7"/>
  <path d="M 175,215 Q 195,210 205,235 Q 190,265 170,255 Z" fill="#10b981" opacity="0.65"/>

  <!-- Atmospheric Aura -->
  <circle cx="256" cy="256" r="108" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.85"/>
  <circle cx="256" cy="256" r="114" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.45"/>

  <!-- Center Holographic Crosshairs & Nodes -->
  <circle cx="256" cy="256" r="6" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="395" cy="180" r="7" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="115" cy="330" r="6" fill="#ec4899" filter="url(#glow)"/>
</svg>
